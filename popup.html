<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>googlepeel</title>
    <style>
        /* Minimal, clean styling for the popup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 400px;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #downloadBtn {
            background: #1a73e8;
            color: white;
        }

        #downloadBtn:hover {
            background: #1557b0;
        }

        #copyBtn {
            background: #34a853;
            color: white;
        }

        #copyBtn:hover {
            background: #2d8f47;
        }

        #clearBtn {
            background: #ea4335;
            color: white;
            flex: 0.5;
        }

        #clearBtn:hover {
            background: #c5372b;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.4;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: vertical;
            background: white;
        }

        textarea:focus {
            outline: none;
            border-color: #1a73e8;
        }

        .status {
            margin-top: 8px;
            padding: 8px;
            font-size: 12px;
            text-align: center;
            border-radius: 4px;
            display: none;
        }

        .status.success {
            display: block;
            background: #e6f4ea;
            color: #137333;
        }

        .status.error {
            display: block;
            background: #fce8e6;
            color: #c5221f;
        }

        .status.info {
            display: block;
            background: #e8f0fe;
            color: #1967d2;
        }

        .count {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h1>📚 Professor URL Collector</h1>

    <div class="btn-group">
        <button id="downloadBtn">📥</button>
        <button id="copyBtn">📋</button>
        <button id="clearBtn">🗑️</button>
    </div>

    <textarea id="urlList"
        placeholder="Collected URLs will appear here...&#10;&#10;1. Go to a Startpage search results page&#10;2. Click 'Collect URLs' to extract faculty/professor links"
        readonly></textarea>

    <div class="count" id="urlCount"></div>
    <div class="status" id="status"></div>

    <script src="popup.js"></script>
</body>

</html>
